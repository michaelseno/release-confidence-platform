# Evidence Governance Workstream A1 -- ADR Decision 7 / Non-Negotiable
# Invariant 7 (adr_evidence_retention_disposal_enforcement.md); Technical
# Design Section 6/13 (evidence_governance_workstream_a1_retention_enforcement_technical_design.md).
#
# Both evidenceDisposalRecorder event sources (the MetadataTable DynamoDB
# Streams event source mapping, and the EventBridge rule delivering S3
# s3:LifecycleExpiration:* notifications) must configure an explicit failure
# destination rather than relying on default retry-then-silent-drop
# behavior, so a dropped disposal-recording attempt is an observable,
# alertable condition -- never a silent gap in FR-A1-5's durable-record
# guarantee.
#
# evidenceDisposalRecorder itself (the Lambda function and its DynamoDB
# Streams event source mapping) is now wired in infra/serverless.yml
# (A1.4a). This queue serves exactly two failure planes going forward
# (Technical Design Section 22.8, A1.4a.0 Round 2 item 2): plane (i)
# (EventBridge-to-Lambda delivery failure, S3 path) and plane (ii) (Lambda
# asynchronous-invocation failure, S3 path) -- never plane (iii) (DynamoDB
# Streams event-source-mapping processing failure), which routes to the
# dedicated recovery bucket instead
# (infra/resources/evidence-disposal-recovery-bucket.yml), never this
# queue. The recovery bucket's own Object Created notification rule (plane
# (v)) also targets this queue, as a pure notification, distinguishable by
# shape/source from a genuine plane-(i)/(ii) failure message.
Resources:
  evidenceDisposalRecorderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${self:provider.stage}-evidence-disposal-recorder-dlq
      # 14 days is the maximum SQS retention period, chosen so a dropped
      # disposal-recording attempt remains inspectable/redriveable for as
      # long as AWS allows, consistent with the "operator inspects and
      # manually redrives" manual-intervention design (Technical Design
      # Section 13 -- no automated redrive is designed for A1).
      MessageRetentionPeriod: 1209600

  evidenceDisposalRecorderDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${self:provider.stage}-evidence-disposal-recorder-dlq-depth
      AlarmDescription: >-
        Fires when evidenceDisposalRecorderDLQ has one or more visible
        messages -- a disposal-recording attempt (DynamoDB Streams TTL path
        or S3 Lifecycle EventBridge path) exhausted its retry budget without
        producing a DisposalRecord. FR-A1-5 requires disposal to be a
        durable, queryable record, not a best-effort attempt whose failure
        is discoverable only in CloudWatch Logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - evidenceDisposalRecorderDLQ
              - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Evidence Governance Workstream A1.4a -- Technical Design Section
  # 22.11/22.14 (A1.4a.0 Round 3 item 10(d)/10(f)). Grants sqs:SendMessage
  # to events.amazonaws.com, scoped by aws:SourceArn to EXACTLY the two
  # EventBridge rule ARNs legitimately authorized to target this queue --
  # the plane-(i) rule (S3-Lifecycle-deletion-events-to-recorder,
  # infra/serverless.yml's evidenceDisposalRecorder eventBridge event) and
  # the recovery-bucket notification rule (plane (v),
  # EvidenceDisposalRecoveryBucketObjectCreatedRule,
  # infra/resources/evidence-disposal-recovery-bucket.yml) -- never a
  # blanket policy admitting any EventBridge rule in the account.
  evidenceDisposalRecorderDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: evidenceDisposalRecorderDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeRulesSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
                - evidenceDisposalRecorderDLQ
                - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - Fn::GetAtt:
                      - EvidenceDisposalRecorderEventBridgeRule
                      - Arn
                  - Fn::GetAtt:
                      - EvidenceDisposalRecoveryBucketObjectCreatedRule
                      - Arn

Outputs:
  EvidenceDisposalRecorderDLQArn:
    Description: SQS DLQ ARN for evidenceDisposalRecorder failure destinations (planes i/ii, A1.4a).
    Value:
      Fn::GetAtt:
        - evidenceDisposalRecorderDLQ
        - Arn
  EvidenceDisposalRecorderDLQUrl:
    Description: SQS DLQ URL for evidenceDisposalRecorder failure destinations (planes i/ii, A1.4a).
    Value:
      Ref: evidenceDisposalRecorderDLQ
