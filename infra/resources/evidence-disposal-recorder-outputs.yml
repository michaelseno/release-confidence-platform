# Evidence Governance Workstream A1.4a -- ADR Decision 13 / Non-Negotiable
# Invariant 51 (adr_evidence_retention_disposal_enforcement.md); Technical
# Design Section 22.9.5
# (evidence_governance_workstream_a1_retention_enforcement_technical_design.md).
#
# Pass 2 of Section 22.9.5's corrected seven-step infrastructure-render
# sequence: added only after Pass 1's isolated-harness render confirmed the
# AWS::Lambda::Function and AWS::Lambda::EventSourceMapping logical IDs this
# file's own Fn::GetAtt/Ref/resources.extensions targets below reference.
#
# Render-confirmed logical IDs (not guessed, not the assumed-but-unconfirmed
# PascalCase convention alone) -- confirmed by an actual local
# `serverless package --stage <stage>` run, in an isolated temporary
# directory copy of this repository with an integer sentinel injected into
# a copy of config/custody_periods.json (never the real file), inspecting
# the generated cloudformation-template-update-stack.json's own Resources
# section, cross-checked for stage-invariance by repeating the render for
# both --stage dev and --stage staging and confirming identical logical IDs
# for every resource referenced below EXCEPT the EventBridge rule (see the
# hand-authored AWS::Events::Rule below for why that one resource is never
# left to Serverless Framework's own auto-generated logical ID):
#   - AWS::Lambda::Function: EvidenceDisposalRecorderLambdaFunction
#     (matches Serverless Framework's own {FunctionName}LambdaFunction
#     PascalCase convention, confirmed by render rather than assumed)
#   - AWS::Lambda::EventSourceMapping:
#     EvidenceDisposalRecorderEventSourceMappingDynamodbMetadataTable (no
#     assumed convention existed for this one per Technical Design Section
#     22.9.5 item 3 -- confirmed by render only)
Outputs:
  EvidenceDisposalRecorderFunctionArn:
    Description: >-
      evidenceDisposalRecorder Lambda function ARN (unqualified), for the
      operator CLI's own StageConfig.disposal_recorder_function_arn field
      (redrive envelope/provenance validation check 2, Technical Design
      Section 22.9.3/22.9.5).
    Value:
      Fn::GetAtt:
        - EvidenceDisposalRecorderLambdaFunction
        - Arn
  EvidenceDisposalRecorderEventSourceMappingUuid:
    Description: >-
      evidenceDisposalRecorder's own DynamoDB Streams event-source-mapping
      UUID, for the operator CLI's own
      StageConfig.disposal_recorder_event_source_mapping_uuid field
      (redrive envelope/provenance validation check 1, Technical Design
      Section 22.9.3/22.9.5). Ref on an AWS::Lambda::EventSourceMapping
      resource returns the mapping's own UUID -- documented AWS
      CloudFormation behavior for this resource type.
    Value:
      Ref: EvidenceDisposalRecorderEventSourceMappingDynamodbMetadataTable

# Hand-authored S3 Lifecycle permanent-deletion EventBridge rule (plane (i),
# Technical Design Section 22.5.2/22.8/22.10) and its own resource-based
# Lambda::Permission grant -- NOT this function's own native
# `events: - eventBridge:` shorthand. Rationale (see the fuller comment on
# infra/serverless.yml's evidenceDisposalRecorder function block, `events:`
# key, immediately above the `- stream:` entry): this installed Serverless
# Framework version's (3.40.0) own EventBridge-event compiler derives that
# shorthand's own auto-generated AWS::Events::Rule logical ID from the
# function's fully-resolved, STAGE-BAKED AWS Lambda function name -- a
# DIFFERENT logical ID per stage for the identical template source,
# confirmed by direct two-stage render comparison. evidence-retention-dlq.yml's
# own AWS::SQS::QueuePolicy (Technical Design Section 22.11/22.14) requires
# a single, stage-INVARIANT Fn::GetAtt target for this rule's own ARN across
# every stage this one template renders for, which a stage-variant logical
# ID cannot serve. This resource's own logical ID,
# EvidenceDisposalRecorderEventBridgeRule, is this correction's own choice
# (confirmed stable/identical across every stage by the same two-stage
# render comparison) -- added here, in Pass 2, because its own Target
# references the Pass-1-confirmed EvidenceDisposalRecorderLambdaFunction
# logical ID.
Resources:
  EvidenceDisposalRecorderEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ${self:service}-${self:provider.stage}-disposal-recorder-s3-deletion
      Description: >-
        Routes RawResultsBucket S3 Lifecycle permanent-deletion
        notifications to evidenceDisposalRecorder (Technical Design Section
        22.5.2). Defense-in-depth EventPattern filtering only -- the
        handler's own two-layer validation (Section 22.5.3) never trusts
        this filter alone.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Deleted
        detail:
          bucket:
            name:
              - ${self:custom.rawResultsBucketName}
      State: ENABLED
      Targets:
        - Id: evidenceDisposalRecorderTarget
          Arn:
            Fn::GetAtt:
              - EvidenceDisposalRecorderLambdaFunction
              - Arn
          # Plane (i)'s own RetryPolicy and DeadLetterConfig (Technical
          # Design Section 22.8/22.10) -- a property of the EventBridge
          # rule/target itself, structurally distinct from plane (ii)'s own
          # function-level destinations/maximumEventAge/maximumRetryAttempts
          # (infra/serverless.yml), even though both ultimately target the
          # same queue.
          RetryPolicy:
            MaximumRetryAttempts: 10
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn:
              Fn::GetAtt:
                - evidenceDisposalRecorderDLQ
                - Arn
  # EventBridge's own permission to invoke this Lambda: a resource-based
  # AWS::Lambda::Permission, structurally identical in kind to
  # AuditAggregationInvokePermissionFromFinalization
  # (phase4-aggregation-iam.yml) -- never a statement inside
  # EvidenceDisposalRecorderLambdaRole's own PolicyDocument (Technical
  # Design Section 22.11, "Distinct, resource-based mechanisms").
  EvidenceDisposalRecorderEventBridgeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: EvidenceDisposalRecorderLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - EvidenceDisposalRecorderEventBridgeRule
          - Arn

# Patches the Pass-1-confirmed AWS::Lambda::EventSourceMapping resource's
# own Properties directly (Technical Design Section 22.9.5/22.10's own
# documented resources.extensions fallback): DestinationConfig.OnFailure
# (plane iii -- the dedicated recovery bucket, never
# evidenceDisposalRecorderDLQ) and MetricsConfig (EventCount opt-in,
# required for OnFailureDestinationDeliveredEventCount/DroppedEventCount to
# emit at all). Neither property is set via the function's own native
# `events: - stream:` shorthand -- see the fuller rationale comment on that
# event block in infra/serverless.yml (this Serverless Framework version has
# no first-class metricsConfig stream-event key at all, and its own
# destinations.onFailure key would incorrectly append an SQS-shaped IAM
# statement to the shared IamRoleLambdaExecution role for a non-SNS
# destination type).
extensions:
  EvidenceDisposalRecorderEventSourceMappingDynamodbMetadataTable:
    Properties:
      DestinationConfig:
        OnFailure:
          Destination:
            Fn::GetAtt:
              - EvidenceDisposalRecoveryBucket
              - Arn
      MetricsConfig:
        Metrics:
          - EventCount
