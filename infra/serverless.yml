service: release-confidence-platform
frameworkVersion: '3'

configValidationMode: error

plugins:
  - serverless-python-requirements
  - ./plugins/stage-guard

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: ${self:custom.logRetentionInDays.${self:provider.stage}}
  environment:
    STAGE: ${self:provider.stage}
    RAW_RESULTS_BUCKET: ${self:custom.rawResultsBucketName}
    METADATA_TABLE: ${self:custom.metadataTableName}
    SCHEDULER_GROUP_NAME: ${self:custom.schedulerGroupName}
    LOG_LEVEL: INFO
    PYTHONPATH: /var/task/src
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/${self:service}-${self:provider.stage}-*:*
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:custom.rawResultsBucketName}
          Condition:
            StringLike:
              s3:prefix:
                - raw-results/*
                - configs/*
                - data-pools/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:HeadObject
          Resource:
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/raw-results/*
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/configs/*
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/data-pools/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/raw-results/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - Fn::GetAtt:
                - MetadataTable
                - Arn
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:custom.secretNamePrefix}*

custom:
  pythonRequirements:
    fileName: ../apps/backend/requirements.txt
    slim: true
    dockerizePip: non-linux
  allowedStages:
    - dev
    - staging
    - prod
  resourcePrefix: release-confidence-platform
  rawResultsBucketName: ${self:custom.resourcePrefix}-${self:provider.stage}-raw-results
  metadataTableName: ${self:custom.resourcePrefix}-${self:provider.stage}-metadata
  schedulerGroupName: rcp-${self:provider.stage}-schedules
  schedulerNamePrefix: rcp-${self:provider.stage}
  secretNamePrefix: ${self:custom.resourcePrefix}/${self:provider.stage}/
  logRetentionInDays:
    dev: 14
    staging: 30
    prod: 90
  # Evidence Governance Workstream A1 -- ADR Decision 5 / Non-Negotiable
  # Invariant 3 (adr_evidence_retention_disposal_enforcement.md); Technical
  # Design Section 5/14/17
  # (evidence_governance_workstream_a1_retention_enforcement_technical_design.md).
  #
  # Per-evidence-class, per-stage custody-period duration, consumed by
  # resources/s3.yml's LifecycleConfiguration.Days/NoncurrentDays and by
  # this function's own Lambda environment binding below. The
  # custody-period duration value itself is a separate, lower-priority
  # Product Strategy decision (AC-A1-5) and is deliberately left
  # unconfigured for every evidence class and every stage.
  #
  # Evidence Governance Workstream A1.3d.0/A1.3d.1 -- ADR Decision 5
  # (A1.3d.0 consolidation amendment) / Non-Negotiable Invariant 29;
  # Technical Design Section 20.3: this block's six keys --
  # raw_evidence, aggregate_metadata, intelligence, report, certificate,
  # retention_marker -- are consolidated onto ONE authoritative, checked-in,
  # stage-indexed configuration source, config/custody_periods.json, via
  # Serverless Framework's native ${file(...)} external-file reference
  # syntax, rather than the inline empty-mapping literals this block
  # previously carried (A1.2/A1.3c.1). This is a source-only migration:
  # every key's fail-closed, no-fallback-value semantics are unchanged --
  # the referenced evidentiary-class and operational-duration objects
  # contain no stage properties, so every stage remains unconfigured until
  # an authorized duration is supplied, and referencing an unconfigured
  # stage still fails Serverless Framework variable resolution at
  # package/deploy time with an unresolved-variable error, exactly as the
  # prior inline {} mapping did.
  # No custody-period duration value may be added to config/custody_periods.json
  # by any change other than a separate, explicit Product Strategy decision.
  #
  # aggregate_metadata's existing Lambda-environment-variable consumption
  # (CUSTODY_PERIOD_DAYS_AGGREGATE_METADATA, bound on auditAggregation
  # below only) is unchanged by this migration -- only the source that
  # custom.custodyPeriodDays.aggregate_metadata itself resolves from
  # changes (inline literal -> external file reference); the binding
  # itself, and every other function's lack of a binding, is untouched.
  #
  # retention_marker (Legal-Hold Correction B2; Technical Design Section
  # 19.5.8; ADR Non-Negotiable Invariant 22): the canary marker's own
  # disposal period, resolved from operational_durations.retention_marker
  # in the same file -- a schema-distinct, non-evidentiary namespace
  # (Technical Design Section 20.3) never conflated with the five
  # evidentiary classes above.
  custodyPeriodDays:
    raw_evidence: ${file(../config/custody_periods.json):evidentiary_classes.raw_evidence.${self:provider.stage}}
    aggregate_metadata: ${file(../config/custody_periods.json):evidentiary_classes.aggregate_metadata.${self:provider.stage}}
    intelligence: ${file(../config/custody_periods.json):evidentiary_classes.intelligence.${self:provider.stage}}
    report: ${file(../config/custody_periods.json):evidentiary_classes.report.${self:provider.stage}}
    certificate: ${file(../config/custody_periods.json):evidentiary_classes.certificate.${self:provider.stage}}
    retention_marker: ${file(../config/custody_periods.json):operational_durations.retention_marker.${self:provider.stage}}

package:
  patterns:
    - '!../**'
    - '../apps/__init__.py'
    - '../apps/backend/**'
    - '!../apps/backend/**/__pycache__/**'
    - '!../apps/backend/**/*.pyc'
    - '../packages/__init__.py'
    - '../packages/audit_lifecycle/**'
    - '../packages/audit_scheduling/**'
    - '../packages/config/**'
    - '../packages/core/**'
    - '../packages/data_generation/**'
    - '../packages/sanitization/**'
    - '../packages/storage/**'
    - '../src/release_confidence_platform/__init__.py'
    - '../src/release_confidence_platform/aggregation/**'
    - '../src/release_confidence_platform/storage/**'
    - '../src/release_confidence_platform/core/**'
    - '../src/release_confidence_platform/audit_lifecycle/**'
    - '../src/release_confidence_platform/sanitization/**'
    - '../src/release_confidence_platform/evidence_retention/**'
    - '!../packages/**/__pycache__/**'
    - '!../packages/**/*.pyc'

functions:
  coreEngineOrchestrator:
    handler: apps.backend.handlers.orchestrator_handler.handler
    timeout: 60
    memorySize: 256
  scheduledExecution:
    handler: apps.backend.handlers.scheduled_execution_handler.handler
    timeout: 300
    memorySize: 512
  auditFinalization:
    handler: apps.backend.handlers.audit_finalization_handler.handler
    timeout: 60
    memorySize: 256
    role:
      Fn::GetAtt:
        - AuditFinalizationLambdaRole
        - Arn
    environment:
      AGGREGATION_FUNCTION_NAME:
        Ref: AuditAggregationLambdaFunction
  auditAggregation:
    handler: apps.backend.handlers.aggregation_handler.handler
    timeout: 300
    memorySize: 512
    role:
      Fn::GetAtt:
        - AuditAggregationLambdaRole
        - Arn
    # Evidence Governance Workstream A1.3c.1 (Technical Design Section
    # 19.16.5/19.16.6; ADR Decision 5 amendment / Non-Negotiable Invariant
    # 26): bound on this function ONLY -- no provider-wide binding, no
    # fallback/default value, no numeric duration. Referencing an unset
    # stage key (custom.custodyPeriodDays.aggregate_metadata.${stage}) is
    # what makes this binding -- not the bare custom.custodyPeriodDays key
    # above -- the fail-closed gate: it fails Serverless Framework variable
    # resolution at package/deploy time until Product Strategy supplies a
    # real value, mirroring the four S3-backed evidence classes' existing
    # Days/NoncurrentDays references above.
    environment:
      CUSTODY_PERIOD_DAYS_AGGREGATE_METADATA: ${self:custom.custodyPeriodDays.aggregate_metadata.${self:provider.stage}}

resources:
  - ${file(resources/s3.yml)}
  - ${file(resources/dynamodb.yml)}
  - ${file(resources/iam.yml)}
  - ${file(resources/phase4-aggregation-iam.yml)}
  - ${file(resources/scheduler.yml)}
  - ${file(resources/evidence-retention-dlq.yml)}
