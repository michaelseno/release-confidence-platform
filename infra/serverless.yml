service: release-confidence-platform
frameworkVersion: '3'

configValidationMode: error

plugins:
  - serverless-python-requirements
  - ./plugins/stage-guard

provider:
  name: aws
  runtime: python3.11
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: ${self:custom.logRetentionInDays.${self:provider.stage}}
  environment:
    STAGE: ${self:provider.stage}
    RAW_RESULTS_BUCKET: ${self:custom.rawResultsBucketName}
    METADATA_TABLE: ${self:custom.metadataTableName}
    SCHEDULER_GROUP_NAME: ${self:custom.schedulerGroupName}
    LOG_LEVEL: INFO
    PYTHONPATH: /var/task/src
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/${self:service}-${self:provider.stage}-*:*
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:custom.rawResultsBucketName}
          Condition:
            StringLike:
              s3:prefix:
                - raw-results/*
                - configs/*
                - data-pools/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:HeadObject
          Resource:
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/raw-results/*
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/configs/*
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/data-pools/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${self:custom.rawResultsBucketName}/raw-results/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - Fn::GetAtt:
                - MetadataTable
                - Arn
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:custom.secretNamePrefix}*

custom:
  pythonRequirements:
    fileName: ../apps/backend/requirements.txt
    slim: true
    dockerizePip: non-linux
  allowedStages:
    - dev
    - staging
    - prod
  resourcePrefix: release-confidence-platform
  rawResultsBucketName: ${self:custom.resourcePrefix}-${self:provider.stage}-raw-results
  metadataTableName: ${self:custom.resourcePrefix}-${self:provider.stage}-metadata
  schedulerGroupName: rcp-${self:provider.stage}-schedules
  schedulerNamePrefix: rcp-${self:provider.stage}
  secretNamePrefix: ${self:custom.resourcePrefix}/${self:provider.stage}/
  logRetentionInDays:
    dev: 14
    staging: 30
    prod: 90
  # Evidence Governance Workstream A1 -- ADR Decision 5 / Non-Negotiable
  # Invariant 3 (adr_evidence_retention_disposal_enforcement.md); Technical
  # Design Section 5/14/17
  # (evidence_governance_workstream_a1_retention_enforcement_technical_design.md).
  #
  # Per-evidence-class, per-stage custody-period duration, consumed by
  # resources/s3.yml's LifecycleConfiguration.Days/NoncurrentDays and by
  # this function's own Lambda environment binding below. The
  # custody-period duration value itself is a separate, lower-priority
  # Product Strategy decision (AC-A1-5) and is deliberately left
  # unconfigured for every evidence class and every stage.
  #
  # Evidence Governance Workstream A1.3d.0/A1.3d.1 -- ADR Decision 5
  # (A1.3d.0 consolidation amendment) / Non-Negotiable Invariant 29;
  # Technical Design Section 20.3: this block's six keys --
  # raw_evidence, aggregate_metadata, intelligence, report, certificate,
  # retention_marker -- are consolidated onto ONE authoritative, checked-in,
  # stage-indexed configuration source, config/custody_periods.json, via
  # Serverless Framework's native ${file(...)} external-file reference
  # syntax, rather than the inline empty-mapping literals this block
  # previously carried (A1.2/A1.3c.1). This is a source-only migration:
  # every key's fail-closed, no-fallback-value semantics are unchanged --
  # the referenced evidentiary-class and operational-duration objects
  # contain no stage properties, so every stage remains unconfigured until
  # an authorized duration is supplied, and referencing an unconfigured
  # stage still fails Serverless Framework variable resolution at
  # package/deploy time with an unresolved-variable error, exactly as the
  # prior inline {} mapping did.
  # No custody-period duration value may be added to config/custody_periods.json
  # by any change other than a separate, explicit Product Strategy decision.
  #
  # aggregate_metadata's existing Lambda-environment-variable consumption
  # (CUSTODY_PERIOD_DAYS_AGGREGATE_METADATA, bound on auditAggregation
  # below only) is unchanged by this migration -- only the source that
  # custom.custodyPeriodDays.aggregate_metadata itself resolves from
  # changes (inline literal -> external file reference); the binding
  # itself, and every other function's lack of a binding, is untouched.
  #
  # retention_marker (Legal-Hold Correction B2; Technical Design Section
  # 19.5.8; ADR Non-Negotiable Invariant 22): the canary marker's own
  # disposal period, resolved from operational_durations.retention_marker
  # in the same file -- a schema-distinct, non-evidentiary namespace
  # (Technical Design Section 20.3) never conflated with the five
  # evidentiary classes above.
  custodyPeriodDays:
    raw_evidence: ${file(../config/custody_periods.json):evidentiary_classes.raw_evidence.${self:provider.stage}}
    aggregate_metadata: ${file(../config/custody_periods.json):evidentiary_classes.aggregate_metadata.${self:provider.stage}}
    intelligence: ${file(../config/custody_periods.json):evidentiary_classes.intelligence.${self:provider.stage}}
    report: ${file(../config/custody_periods.json):evidentiary_classes.report.${self:provider.stage}}
    certificate: ${file(../config/custody_periods.json):evidentiary_classes.certificate.${self:provider.stage}}
    retention_marker: ${file(../config/custody_periods.json):operational_durations.retention_marker.${self:provider.stage}}
    # Evidence Governance Workstream A1.4a -- Technical Design Section
    # 22.9.2 (A1.4a.0 Round 3 item 9): the recovery bucket is operational
    # recovery storage, not an evidentiary class -- its duration is
    # configured through the same operational_durations namespace
    # retention_marker already uses, never evidentiary_classes. No numeric
    # duration value is introduced by this correction.
    disposal_recovery: ${file(../config/custody_periods.json):operational_durations.disposal_recovery.${self:provider.stage}}
  # Evidence Governance Workstream A1.4a -- Technical Design Section 22.9.5
  # item 1 (A1.4a.0 Round 7 item 3): the recovery bucket's own name is
  # deterministic from stage, mirroring rawResultsBucketName's/
  # metadataTableName's own existing entries exactly. infra/serverless.yml
  # is this value's own authoritative source -- consumed directly by
  # infra/resources/evidence-disposal-recovery-bucket.yml's own
  # AWS::S3::Bucket resource as its BucketName property, and manually
  # transcribed into config/stages/{stage}.json's own
  # disposal_recovery_bucket_name StageConfig field at deployment time.
  disposalRecoveryBucketName: ${self:custom.resourcePrefix}-${self:provider.stage}-disposal-recovery

package:
  patterns:
    - '!../**'
    - '../apps/__init__.py'
    - '../apps/backend/**'
    - '!../apps/backend/**/__pycache__/**'
    - '!../apps/backend/**/*.pyc'
    - '../packages/__init__.py'
    - '../packages/audit_lifecycle/**'
    - '../packages/audit_scheduling/**'
    - '../packages/config/**'
    - '../packages/core/**'
    - '../packages/data_generation/**'
    - '../packages/sanitization/**'
    - '../packages/storage/**'
    - '../src/release_confidence_platform/__init__.py'
    - '../src/release_confidence_platform/aggregation/**'
    - '../src/release_confidence_platform/storage/**'
    - '../src/release_confidence_platform/core/**'
    - '../src/release_confidence_platform/audit_lifecycle/**'
    - '../src/release_confidence_platform/sanitization/**'
    - '../src/release_confidence_platform/evidence_retention/**'
    - '!../packages/**/__pycache__/**'
    - '!../packages/**/*.pyc'

functions:
  coreEngineOrchestrator:
    handler: apps.backend.handlers.orchestrator_handler.handler
    timeout: 60
    memorySize: 256
  scheduledExecution:
    handler: apps.backend.handlers.scheduled_execution_handler.handler
    timeout: 300
    memorySize: 512
  auditFinalization:
    handler: apps.backend.handlers.audit_finalization_handler.handler
    timeout: 60
    memorySize: 256
    role:
      Fn::GetAtt:
        - AuditFinalizationLambdaRole
        - Arn
    environment:
      AGGREGATION_FUNCTION_NAME:
        Ref: AuditAggregationLambdaFunction
  auditAggregation:
    handler: apps.backend.handlers.aggregation_handler.handler
    timeout: 300
    memorySize: 512
    role:
      Fn::GetAtt:
        - AuditAggregationLambdaRole
        - Arn
    # Evidence Governance Workstream A1.3c.1 (Technical Design Section
    # 19.16.5/19.16.6; ADR Decision 5 amendment / Non-Negotiable Invariant
    # 26): bound on this function ONLY -- no provider-wide binding, no
    # fallback/default value, no numeric duration. Referencing an unset
    # stage key (custom.custodyPeriodDays.aggregate_metadata.${stage}) is
    # what makes this binding -- not the bare custom.custodyPeriodDays key
    # above -- the fail-closed gate: it fails Serverless Framework variable
    # resolution at package/deploy time until Product Strategy supplies a
    # real value, mirroring the four S3-backed evidence classes' existing
    # Days/NoncurrentDays references above.
    environment:
      CUSTODY_PERIOD_DAYS_AGGREGATE_METADATA: ${self:custom.custodyPeriodDays.aggregate_metadata.${self:provider.stage}}
  # Evidence Governance Workstream A1.4a -- ADR Decision 13 / Non-Negotiable
  # Invariants 38-51 (adr_evidence_retention_disposal_enforcement.md);
  # Technical Design Section 22 in full
  # (evidence_governance_workstream_a1_retention_enforcement_technical_design.md).
  #
  # Consumes both DynamoDB Streams TTL-driven REMOVE events (MetadataTable)
  # and S3 EventBridge "Object Deleted" notifications (RawResultsBucket
  # Lifecycle permanent deletions), producing a durable DisposalRecord for
  # each (FR-A1-5/AC-A1-6). References the dedicated
  # EvidenceDisposalRecorderLambdaRole (Technical Design Section 22.11) --
  # never the shared provider.iam.role.statements block.
  evidenceDisposalRecorder:
    handler: apps.backend.handlers.evidence_disposal_recorder_handler.handler
    timeout: 60
    memorySize: 256
    role:
      Fn::GetAtt:
        - EvidenceDisposalRecorderLambdaRole
        - Arn
    environment:
      METADATA_TABLE_STREAM_ARN:
        Fn::GetAtt:
          - MetadataTable
          - StreamArn
      AWS_ACCOUNT_ID:
        Fn::Sub: "${AWS::AccountId}"
    # Lambda asynchronous-invocation retry configuration, plane (ii)
    # (Technical Design Section 22.8/22.10) -- the S3 EventBridge path's own
    # async-invoke failure destination and retry budget. AWS's own maximum
    # permitted values for this mechanism (a 0-2 retry range, a 60-21600
    # second age window) are used directly, not an arbitrary pick. Never
    # applied to the DynamoDB Streams path -- that path's own retry/failure
    # contract is entirely the stream event's own MaximumRetryAttempts/
    # MaximumRecordAgeInSeconds/DestinationConfig below, a structurally
    # distinct mechanism.
    destinations:
      onFailure:
        arn:
          Fn::GetAtt:
            - evidenceDisposalRecorderDLQ
            - Arn
        type: sqs
    maximumEventAge: 21600
    maximumRetryAttempts: 2
    events:
      # DynamoDB Streams TTL-driven REMOVE path (Technical Design Section
      # 22.4/22.10). Explicit, non-default parameter selection throughout --
      # StartingPosition LATEST (never TRIM_HORIZON, so this recorder never
      # silently backfills pre-existing stream content); FilterCriteria
      # scoped to eventName == REMOVE at the event-source-mapping level
      # (defense-in-depth cost reduction only -- the handler's own
      # eventName == REMOVE check, Section 22.4, is never removed or
      # weakened on this filter's assumption alone); batch size 25;
      # MaximumRetryAttempts 3; MaximumRecordAgeInSeconds 72000 (20h, within
      # DynamoDB Streams' own fixed 24h retention window);
      # ParallelizationFactor 1 (DynamoDB Streams' own strict per-shard
      # ordering, retained at the default); ReportBatchItemFailures +
      # BisectBatchOnFunctionError together (Section 22.10's corrected
      # contract -- the function's own returned lowest-failed-sequence-
      # number is the checkpoint/bisection boundary directly).
      #
      # DestinationConfig.OnFailure (plane iii, targeting the dedicated
      # recovery bucket -- never evidenceDisposalRecorderDLQ) and
      # MetricsConfig (EventCount opt-in, required for
      # OnFailureDestinationDeliveredEventCount/DroppedEventCount to emit
      # at all, Section 22.10) are deliberately NOT configured via this
      # event's own `destinations`/`metricsConfig` keys: this Serverless
      # Framework version (3.40.0) does not expose a first-class
      # metricsConfig stream-event key at all (confirmed by direct
      # inspection of this installed version's own event compiler), and its
      # `destinations.onFailure` key restricts the destination `type` to
      # sns/sqs only and -- for any function using a dedicated, non-default
      # execution role, as this one does -- would still unconditionally
      # attempt to append an SQS-shaped IAM statement to the SHARED
      # IamRoleLambdaExecution role if one exists in this template (it
      # does, for the four functions still using provider.iam.role.statements),
      # which would incorrectly grant an unrelated statement on this
      # function's own S3 recovery-bucket ARN to that shared role. Both
      # properties are instead applied via `resources.extensions` below,
      # patching the rendered AWS::Lambda::EventSourceMapping resource's
      # own Properties directly once its logical ID is confirmed by Pass
      # 1's render (Technical Design Section 22.9.5/22.10's own documented
      # resources.extensions fallback for this exact gap).
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt:
              - MetadataTable
              - StreamArn
          batchSize: 25
          startingPosition: LATEST
          maximumRetryAttempts: 3
          maximumRecordAgeInSeconds: 72000
          parallelizationFactor: 1
          bisectBatchOnFunctionError: true
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - eventName:
                - REMOVE
      # S3 Lifecycle permanent-deletion path, via EventBridge (Technical
      # Design Section 22.5/22.8/22.10) -- plane (i)'s own RetryPolicy
      # (MaximumRetryAttempts 10, MaximumEventAgeInSeconds 3600) and
      # DeadLetterConfig, pointed at evidenceDisposalRecorderDLQ, targeting
      # this function. This is DELIBERATELY NOT configured via this
      # function's own native `events: - eventBridge:` shorthand (Technical
      # Design Section 22.9.5/22.14's own documented render-confirmation
      # discipline is what surfaced this): this Serverless Framework
      # version's (3.40.0) own EventBridge-event compiler derives that
      # shorthand's own auto-generated AWS::Events::Rule logical ID from the
      # function's own fully-resolved, STAGE-BAKED AWS Lambda function name
      # (confirmed by direct two-stage comparison of an actual local
      # render's own generated cloudformation-template-update-stack.json:
      # rendering this exact function/event configuration for --stage dev
      # produced logical ID `Releaseconfidenceplatformdev...EventBridgeRule`,
      # while --stage staging produced
      # `Releaseconfidenceplatformstaging...EventBridgeRule` -- a DIFFERENT
      # logical ID per stage, for the identical template source).
      # evidence-retention-dlq.yml's own AWS::SQS::QueuePolicy (Technical
      # Design Section 22.11/22.14) must reference this rule's own ARN via a
      # single, stage-INVARIANT Fn::GetAtt target across every stage this
      # one template renders for -- a stage-variant logical ID cannot serve
      # that reference at all. The rule and its own resource-based
      # Lambda::Permission are therefore hand-authored instead, in
      # infra/resources/evidence-disposal-recorder-outputs.yml (Pass 2,
      # alongside the two Outputs, both of which already require Pass 1's
      # confirmed EvidenceDisposalRecorderLambdaFunction logical ID), with a
      # logical ID of this correction's own choosing --
      # EvidenceDisposalRecorderEventBridgeRule -- confirmed stable
      # (identical across every stage) by the same two-stage render
      # comparison. This also matches this codebase's own established
      # convention (scheduler.yml, phase4-aggregation-iam.yml) of
      # hand-authoring resource-based Lambda::Permission grants rather than
      # relying on framework shorthand.

resources:
  - ${file(resources/s3.yml)}
  - ${file(resources/dynamodb.yml)}
  - ${file(resources/iam.yml)}
  - ${file(resources/phase4-aggregation-iam.yml)}
  - ${file(resources/scheduler.yml)}
  - ${file(resources/evidence-retention-dlq.yml)}
  # Evidence Governance Workstream A1.4a -- Technical Design Section
  # 22.9.5's corrected seven-step infrastructure-render sequence, Pass 0:
  # neither fragment below references a logical ID that sequence exists to
  # discover -- both are complete, self-contained resource definitions the
  # evidenceDisposalRecorder function block above already refers to (its
  # `role` property and, via resources.extensions once confirmed, its
  # event-source mapping's own OnFailure destination) -- so both import
  # lines are added before Pass 1, not deferred to Pass 2 alongside the
  # Outputs fragment below.
  - ${file(resources/evidence-disposal-recorder-iam.yml)}
  - ${file(resources/evidence-disposal-recovery-bucket.yml)}
  # Pass 2: added only after Pass 1's render confirmed the
  # AWS::Lambda::Function and AWS::Lambda::EventSourceMapping logical IDs
  # this fragment's own Outputs/resources.extensions/hand-authored
  # EventBridge rule target.
  - ${file(resources/evidence-disposal-recorder-outputs.yml)}
